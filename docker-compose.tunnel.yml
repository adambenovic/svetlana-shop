# Local deployment served through a Cloudflare tunnel running on the host.
# The app is published only on 127.0.0.1:43117 — point the tunnel at
# http://localhost:43117. No reverse proxy needed (Cloudflare terminates TLS).
#
#   docker compose -f docker-compose.tunnel.yml --env-file .env.tunnel up -d
#
# Logs go to the host journal (survive container recreation):
#   journalctl CONTAINER_NAME=svetlana-shop-app-1 -f

# Shared logging config for both services
x-logging: &journald
  driver: journald
  options:
    tag: "{{.Name}}"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-svetlana}
      POSTGRES_USER: ${POSTGRES_USER:-svetlana}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Europe/Bratislava
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-svetlana}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    logging: *journald

  app:
    image: svetlana-shop:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URI: postgresql://${POSTGRES_USER:-svetlana}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-svetlana}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      GOPAY_ENV: ${GOPAY_ENV:-prod}
      GOPAY_API_URL: ${GOPAY_API_URL}
      GOPAY_CLIENT_ID: ${GOPAY_CLIENT_ID}
      GOPAY_CLIENT_SECRET: ${GOPAY_CLIENT_SECRET}
      GOPAY_GO_ID: ${GOPAY_GO_ID}
      GOPAY_TEST_API_URL: ${GOPAY_TEST_API_URL:-https://gw.sandbox.gopay.com/api}
      GOPAY_TEST_CLIENT_ID: ${GOPAY_TEST_CLIENT_ID}
      GOPAY_TEST_CLIENT_SECRET: ${GOPAY_TEST_CLIENT_SECRET}
      GOPAY_TEST_GO_ID: ${GOPAY_TEST_GO_ID}
      PACKETA_API_KEY: ${PACKETA_API_KEY}
      NEXT_PUBLIC_PACKETA_WIDGET_KEY: ${NEXT_PUBLIC_PACKETA_WIDGET_KEY}
      BREVO_API_KEY: ${BREVO_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      INVOICE_BACKFILL_TOKEN: ${INVOICE_BACKFILL_TOKEN}
      # Operator alerts (stuck payments, invoice failures); empty = log only
      OPS_EMAIL: ${OPS_EMAIL:-}
      TZ: Europe/Bratislava
      # Next standalone binds to $HOSTNAME; Docker's default (container id)
      # would make it unreachable on 127.0.0.1 for the healthcheck
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - media:/app/public/media
      # Generated invoices (PDF) — NOT under public/, served only via tokenized route
      - invoices:/app/invoices
    ports:
      - "127.0.0.1:43117:3000"
    healthcheck:
      # GET /api/health runs `select 1` — the first call also triggers pending migrations
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 1g
    pids_limit: 256
    # Runs as the image's non-root `node` user; needs no capabilities
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Upstream resolvers for GoPay/Brevo/Packeta lookups (Docker's embedded
    # DNS still resolves the `postgres` service name)
    dns:
      - 1.1.1.1
      - 9.9.9.9
    logging: *journald

volumes:
  pgdata:
  media:
  invoices:
